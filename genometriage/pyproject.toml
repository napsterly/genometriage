[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "genometriage"
version = "0.1.0"
description = "Benchmark-first genomic variant prioritization research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GenomeTriage contributors" }]
dependencies = [
  "pydantic==1.10.26",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
]

[project.scripts]
genometriage-baseline = "genometriage.baseline.run:main"
genometriage-eval = "genometriage.evaluation.run:main"
genometriage-validate = "genometriage.benchmark.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -p no:cacheprovider"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["genometriage"]
